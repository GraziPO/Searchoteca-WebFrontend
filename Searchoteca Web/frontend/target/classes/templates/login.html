<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar - Searchoteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <span class="logo">Searchoteca</span>
        <div class="auth-subtitle">Entre com sua conta para continuar</div>

        <div class="auth-error" th:if="${erro}" th:text="${erro}"></div>
        <div class="auth-info" th:if="${info}" th:text="${info}"></div>

        <form th:action="@{/login}" method="post">
            <div>
                <label>USUÁRIO</label>
                <input type="text" name="username" required autofocus autocomplete="username">
            </div>
            <div>
                <label>SENHA</label>
                <input type="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-solid">Entrar</button>
        </form>

        <div class="auth-footer-link">
            <a th:href="@{/esqueci-senha}">Esqueci a senha</a>
        </div>

        <div class="auth-footer-link">
            <a th:href="@{/consulta}">Consultar o acervo sem entrar →</a>
        </div>

        <div class="auth-footer-link muted">
            <a th:href="@{/termos-de-uso}" target="_blank">Termos de Uso</a>
            &nbsp;·&nbsp;
            <a th:href="@{/politica-de-privacidade}" target="_blank">Política de Privacidade</a>
        </div>
    </div>
</div>

</body>
</html>
