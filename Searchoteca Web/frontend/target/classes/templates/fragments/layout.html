<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Barra de topo. Uso: th:replace="~{fragments/layout :: topbar}" -->
<div th:fragment="topbar" class="topbar">
    <a th:href="@{/}" class="logo">Searchoteca</a>
    <div class="topbar-right" th:if="${currentUser}">
        <div class="topbar-user">
            <span class="topbar-name" th:text="${currentUser}">usuário</span>
            <span class="topbar-role" th:text="${currentRoleLabel}">perfil</span>
        </div>
        <a th:href="@{/conta/senha}" class="topbar-link">Alterar senha</a>
        <a th:href="@{/logout}" class="avatar-btn" title="Sair">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        </a>
    </div>
    <div class="topbar-right" th:unless="${currentUser}">
        <a th:href="@{/login}" class="btn-outline btn-small">Entrar</a>
    </div>
</div>

<!--
  Menu lateral. Uso: th:replace="~{fragments/layout :: sidebar('acervo')}"
  Os links aparecem conforme o perfil (RoleAccess). O backend continua sendo quem bloqueia de verdade.
-->
<nav th:fragment="sidebar(active)" class="sidebar">
    <th:block th:if="${nav.student()}">
        <a th:href="@{/meus-emprestimos}" class="sidebar-item" th:classappend="${active == 'meus'} ? 'active' : ''">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
            </svg>
            MEUS EMPRÉSTIMOS
        </a>
    </th:block>

    <a th:if="${nav.users()}" th:href="@{/usuarios}" class="sidebar-item" th:classappend="${active == 'usuarios'} ? 'active' : ''">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        USUÁRIOS
    </a>
    <a th:if="${nav.archive()}" th:href="@{/acervo}" class="sidebar-item" th:classappend="${active == 'acervo'} ? 'active' : ''">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        ACERVO
    </a>
    <a th:if="${nav.loans()}" th:href="@{/emprestimos}" class="sidebar-item" th:classappend="${active == 'emprestimos'} ? 'active' : ''">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        EMPRÉSTIMOS
    </a>
    <a th:if="${nav.exits()}" th:href="@{/saidas/nova}" class="sidebar-item" th:classappend="${active == 'saidas'} ? 'active' : ''">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="8" y1="13" x2="16" y2="13"></line>
            <line x1="8" y1="17" x2="13" y2="17"></line>
        </svg>
        SAÍDAS E COMPROVANTES
    </a>
    <a th:if="${nav.audit()}" th:href="@{/relatorios/auditoria}" class="sidebar-item" th:classappend="${active == 'relatorios'} ? 'active' : ''">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            <path d="M8 21h8M12 17v4"></path>
        </svg>
        RELATÓRIOS
    </a>
    <a th:href="@{/consulta}" class="sidebar-item" th:classappend="${active == 'consulta'} ? 'active' : ''">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M21 21l-4.35-4.35"></path>
        </svg>
        CONSULTAR ACERVO
    </a>
</nav>

<!-- Mensagens de retorno das ações. Uso: th:replace="~{fragments/layout :: alerts}" -->
<th:block th:fragment="alerts">
    <div class="alert alert-error" th:if="${erro}" th:text="${erro}"></div>
    <div class="alert alert-info" th:if="${info}" th:text="${info}"></div>
</th:block>

</body>
</html>
