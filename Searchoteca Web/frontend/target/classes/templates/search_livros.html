<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title th:text="${editando} ? 'Editar Livro' : 'Novo Livro'">Novo Livro - Searchoteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar}"></div>

<div class="page-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('acervo')}"></div>

    <main class="content">
        <a th:href="@{/acervo/livros}" class="back-link">←</a>
        <div class="page-banner">Searchoteca</div>

        <div class="breadcrumb">ACERVO / LIVROS</div>
        <h1 class="page-title" th:text="${editando} ? 'Editar livro' : 'Incluir livro'">Incluir livro</h1>

        <div class="form-card">
            <form th:action="${editando} ? @{'/acervo/livros/' + ${livro.isbn} + '/editar'} : @{/acervo/livros}"
                  th:object="${livro}" method="post" class="data-form">
                <div>
                    <label>ISBN</label>
                    <input type="text" th:field="*{isbn}" th:readonly="${editando}" required>
                </div>
                <div>
                    <label>TÍTULO</label>
                    <input type="text" th:field="*{title}" required>
                </div>
                <div>
                    <label>AUTOR</label>
                    <input type="text" th:field="*{author}" required>
                </div>
                <div>
                    <label>ANO DE LANÇAMENTO</label>
                    <input type="number" th:field="*{rel_year}">
                </div>
                <div>
                    <label>EDITORA</label>
                    <input type="text" th:field="*{publisher}">
                </div>
                <div>
                    <label>GÊNERO</label>
                    <input type="text" th:field="*{genre}">
                </div>

                <div class="form-actions">
                    <a th:href="@{/acervo/livros}" class="btn-outline">Cancelar</a>
                    <button type="submit" class="btn-solid" th:text="${editando} ? 'ATUALIZAR' : 'Incluir'">Incluir</button>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>
