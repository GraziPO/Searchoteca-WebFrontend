<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title th:text="${editando} ? 'Editar Localização' : 'Nova Localização'">Nova Localização - Searchoteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar}"></div>

<div class="page-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('acervo')}"></div>

    <main class="content">
        <a th:href="@{/acervo/localizacoes}" class="back-link">←</a>
        <div class="page-banner">Searchoteca</div>

        <div class="breadcrumb">ACERVO / LOCALIZAÇÕES</div>
        <h1 class="page-title" th:text="${editando} ? 'Editar localização' : 'Incluir localização'">Incluir localização</h1>

        <div class="form-card">
            <form th:action="${editando} ? @{'/acervo/localizacoes/' + ${localizacao.localCode} + '/editar'} : @{/acervo/localizacoes}"
                  th:object="${localizacao}" method="post" class="data-form">
                <div>
                    <label>CÓDIGO</label>
                    <input type="text" th:field="*{localCode}" th:readonly="${editando}" required>
                </div>
                <div>
                    <label>NOME</label>
                    <input type="text" th:field="*{localName}" required>
                </div>
                <div>
                    <label>DEPARTAMENTO (código)</label>
                    <input type="text" th:field="*{departCode}">
                </div>
                <div class="field-full">
                    <label>DESCRIÇÃO</label>
                    <textarea th:field="*{localDesc}" rows="4"></textarea>
                </div>

                <div class="form-actions">
                    <a th:href="@{/acervo/localizacoes}" class="btn-outline">Cancelar</a>
                    <button type="submit" class="btn-solid" th:text="${editando} ? 'ATUALIZAR' : 'Incluir'">Incluir</button>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>
