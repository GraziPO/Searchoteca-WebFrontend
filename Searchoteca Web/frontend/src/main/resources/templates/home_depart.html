<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Departamentos - Searchoteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar('Minha Biblioteca')}"></div>

<div class="page-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('acervo')}"></div>

    <main class="content">
        <a th:href="@{/acervo}" class="back-link">←</a>

        <div class="content-header">
            <h1>DEPARTAMENTOS</h1>
            <a th:href="@{/acervo/departamentos/novo}" class="btn-add">+</a>
        </div>

        <table class="data-table">
            <thead>
            <tr>
                <th>CÓDIGO</th>
                <th>NOME</th>
                <th>DESCRIÇÃO</th>
                <th>AÇÕES</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="depart : ${departamentos}">
                <td th:text="${depart.departCode}"></td>
                <td th:text="${depart.departName}"></td>
                <td th:text="${depart.departDesc}"></td>
                <td class="actions-cell">
                    <a th:href="@{'/acervo/departamentos/' + ${depart.departCode} + '/editar'}" class="btn-edit">Editar</a>
                    <form th:action="@{'/acervo/departamentos/' + ${depart.departCode} + '/excluir'}" method="post"
                          onsubmit="return confirm('Excluir este departamento?');" class="inline-form">
                        <button type="submit" class="btn-delete">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr class="empty-row" th:if="${#lists.isEmpty(departamentos)}">
                <td colspan="4">Nenhum departamento cadastrado ainda.</td>
            </tr>
            </tbody>
        </table>
    </main>
</div>

</body>
</html>
