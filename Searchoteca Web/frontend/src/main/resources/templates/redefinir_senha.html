<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redefinir senha - Searchoteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <span class="logo">Searchoteca</span>
        <div class="auth-subtitle">Digite o código recebido por e-mail e a nova senha.</div>

        <div class="auth-error" th:if="${erro}" th:text="${erro}"></div>
        <div class="auth-info" th:if="${info}" th:text="${info}"></div>

        <form th:action="@{/redefinir-senha}" method="post">
            <div>
                <label>USUÁRIO OU E-MAIL</label>
                <input type="text" name="login" th:value="${login}" required autocomplete="username">
            </div>
            <div>
                <label>CÓDIGO</label>
                <input type="text" name="code" maxlength="6" inputmode="numeric"
                       autocomplete="one-time-code" required th:autofocus="${login != null}">
                <div class="hint">O código vale por 15 minutos.</div>
            </div>
            <div>
                <label>NOVA SENHA</label>
                <input type="password" name="newPassword" required minlength="8" maxlength="72" autocomplete="new-password">
                <div class="hint" th:text="${dica}">A senha deve ter ao menos 8 caracteres.</div>
            </div>
            <div>
                <label>CONFIRME A NOVA SENHA</label>
                <input type="password" name="confirmPassword" required minlength="8" maxlength="72" autocomplete="new-password">
            </div>
            <button type="submit" class="btn-solid">Redefinir senha</button>
        </form>

        <div class="auth-footer-link">
            <a th:href="@{/esqueci-senha}">Pedir outro código</a>
            &nbsp;·&nbsp;
            <a th:href="@{/login}">Voltar ao login</a>
        </div>
    </div>
</div>

</body>
</html>
