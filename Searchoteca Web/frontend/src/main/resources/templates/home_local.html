<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Localizações - Searchoteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar}"></div>

<div class="page-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('acervo')}"></div>

    <main class="content">
        <a th:href="@{/acervo}" class="back-link">←</a>
        <div class="page-banner">Searchoteca</div>

        <div class="breadcrumb">ACERVO / LOCALIZAÇÕES</div>
        <div class="list-header">
            <h1 class="page-title big">LOCALIZAÇÕES</h1>
            <a th:href="@{/acervo/localizacoes/novo}" class="btn-solid">+ Incluir localização</a>
        </div>

        <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="M21 21l-4.35-4.35"></path>
            </svg>
            <input type="text" placeholder="Buscar localizações..." disabled>
        </div>

        <table class="data-table" th:if="${not #lists.isEmpty(localizacoes)}">
            <thead>
            <tr>
                <th>CÓDIGO</th>
                <th>NOME</th>
                <th>DESCRIÇÃO</th>
                <th>DEPARTAMENTO</th>
                <th>AÇÕES</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="local : ${localizacoes}">
                <td th:text="${local.localCode}"></td>
                <td th:text="${local.localName}"></td>
                <td th:text="${local.localDesc}"></td>
                <td th:text="${local.departCode}"></td>
                <td class="actions-cell">
                    <a th:href="@{'/acervo/localizacoes/' + ${local.localCode} + '/editar'}" class="btn-edit">Editar</a>
                    <form th:action="@{'/acervo/localizacoes/' + ${local.localCode} + '/excluir'}" method="post"
                          onsubmit="return confirm('Excluir esta localização?');" class="inline-form">
                        <button type="submit" class="btn-delete">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="empty-state" th:if="${#lists.isEmpty(localizacoes)}">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 21s-7-5.686-7-11a7 7 0 0 1 14 0c0 5.314-7 11-7 11z"></path>
                <circle cx="12" cy="10" r="2.5"></circle>
            </svg>
            <div class="empty-title">Nenhuma localização cadastrada</div>
            <div>Inclua a primeira localização para começar.</div>
        </div>
    </main>
</div>

</body>
</html>
