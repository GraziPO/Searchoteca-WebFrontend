<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Livros - Searchoteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar('Minha Biblioteca')}"></div>

<div class="page-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('acervo')}"></div>

    <main class="content">
        <a th:href="@{/acervo}" class="back-link">←</a>

        <div class="content-header">
            <h1>LIVROS</h1>
            <a th:href="@{/acervo/livros/novo}" class="btn-add">+</a>
        </div>

        <table class="data-table">
            <thead>
            <tr>
                <th>TÍTULO</th>
                <th>AUTOR</th>
                <th>LOCAL</th>
                <th>DEPARTAMENTO</th>
                <th>AÇÕES</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="livro : ${livros}">
                <td th:text="${livro.title}"></td>
                <td th:text="${livro.author}"></td>
                <td th:text="${livro.localCode}"></td>
                <td th:text="${livro.departCode}"></td>
                <td class="actions-cell">
                    <a th:href="@{'/acervo/livros/' + ${livro.isbn} + '/editar'}" class="btn-edit">Editar</a>
                    <form th:action="@{'/acervo/livros/' + ${livro.isbn} + '/excluir'}" method="post"
                          onsubmit="return confirm('Excluir este livro?');" class="inline-form">
                        <button type="submit" class="btn-delete">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr class="empty-row" th:if="${#lists.isEmpty(livros)}">
                <td colspan="5">Nenhum livro cadastrado ainda.</td>
            </tr>
            </tbody>
        </table>
    </main>
</div>

</body>
</html>
