<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title th:text="${editando} ? 'Editar Livro' : 'Novo Livro'">Novo Livro - Searchoteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar('Minha Biblioteca')}"></div>

<div class="page-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('acervo')}"></div>

    <main class="content">
        <a th:href="@{/acervo/livros}" class="back-link">←</a>
        <h1 style="color:#9B2226;" th:text="${editando} ? 'EDITAR LIVRO' : 'NOVO LIVRO'">NOVO LIVRO</h1>

        <form th:action="${editando} ? @{'/acervo/livros/' + ${livro.isbn} + '/editar'} : @{/acervo/livros}"
              th:object="${livro}" method="post" class="data-form">
            <label>ISBN</label>
            <input type="text" th:field="*{isbn}" th:readonly="${editando}" required>

            <label>TÍTULO</label>
            <input type="text" th:field="*{title}" required>

            <label>AUTOR</label>
            <input type="text" th:field="*{author}" required>

            <label>ANO DE LANÇAMENTO</label>
            <input type="number" th:field="*{rel_year}">

            <label>EDITORA</label>
            <input type="text" th:field="*{publisher}">

            <label>GENERO</label>
            <input type="text" th:field="*{genre}">

            <label>LOCALIZAÇÃO (código)</label>
            <input type="text" th:field="*{localCode}">

            <label>DEPARTAMENTO (código)</label>
            <input type="text" th:field="*{departCode}">

            <button type="submit" class="btn-submit" th:text="${editando} ? 'ATUALIZAR' : 'INCLUIR'">INCLUIR</button>
        </form>
    </main>
</div>

</body>
</html>
