<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title th:text="${editando} ? 'Editar Departamento' : 'Novo Departamento'">Novo Departamento - Searchoteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar}"></div>

<div class="page-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('acervo')}"></div>

    <main class="content">
        <a th:href="@{/acervo/departamentos}" class="back-link">←</a>
        <div class="page-banner">Searchoteca</div>

        <div class="breadcrumb">ACERVO / DEPARTAMENTOS</div>
        <h1 class="page-title" th:text="${editando} ? 'Editar departamento' : 'Incluir departamento'">Incluir departamento</h1>

        <div class="form-card">
            <form th:action="${editando} ? @{'/acervo/departamentos/' + ${departamento.departCode} + '/editar'} : @{/acervo/departamentos}"
                  th:object="${departamento}" method="post" class="data-form">
                <div>
                    <label>CÓDIGO</label>
                    <input type="text" th:field="*{departCode}" th:readonly="${editando}" required>
                </div>
                <div>
                    <label>NOME</label>
                    <input type="text" th:field="*{departName}" required>
                </div>
                <div class="field-full">
                    <label>DESCRIÇÃO</label>
                    <textarea th:field="*{departDesc}" rows="4"></textarea>
                </div>

                <div class="form-actions">
                    <a th:href="@{/acervo/departamentos}" class="btn-outline">Cancelar</a>
                    <button type="submit" class="btn-solid" th:text="${editando} ? 'ATUALIZAR' : 'Incluir'">Incluir</button>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>
